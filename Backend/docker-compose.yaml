#      GF_SECURITY_ADMIN_USER: admin
#      GF_SECURITY_ADMIN_PASSWORD: admin
#    volumes:
#      - grafana_data:/var/lib/grafana
#    depends_on:
#      - prometheus

volumes:
  db_data:
  db_group_data:
  rabbitmq_data:
  redis_data:
  certbot-etc:
  certbot-var:
  www-data:
#  prometheus_data:
#  grafana_data:
