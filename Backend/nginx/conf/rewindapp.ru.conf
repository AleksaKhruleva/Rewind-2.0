# --- Конфигурация HTTP (порт 80) ---
# Этот блок слушает порт 80 и используется для прохождения проверки домена Certbot'ом
# и для автоматического перенаправления HTTP трафика на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rewindapp.ru www.rewindapp.ru;

    # Location для файлов проверки домена Certbot'ом (Webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Остальной HTTP трафик перенаправляем на HTTPS (порт 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Конфигурация HTTPS (порт 443) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rewindapp.ru www.rewindapp.ru;

    ssl_certificate /etc/letsencrypt/live/rewindapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rewindapp.ru/privkey.pem;

    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Прокси на сервис API Gateway
    location / {
        proxy_pass http://api-gateway-service:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Если нужно будет WebSocket
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # Логи доступа и ошибок
    access_log /var/log/nginx/rewindapp.ru.access.log;
    error_log /var/log/nginx/rewindapp.ru.error.log;
}
