# --- Конфигурация HTTP (порт 80) ---
# Этот блок слушает порт 80 и используется для прохождения проверки домена Certbot'ом
# и для автоматического перенаправления HTTP трафика на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rewindapp.ru www.rewindapp.ru;

    # Location для файлов проверки домена Certbot'ом (Webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Остальной HTTP трафик перенаправляем на HTTPS (порт 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Конфигурация HTTPS (порт 443) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rewindapp.ru www.rewindapp.ru;

    ssl_certificate /etc/letsencrypt/live/rewindapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rewindapp.ru/privkey.pem;

    # include /etc/letsencrypt/options-ssl-nginx.conf; # Раскомментируйте, если используете
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # Раскомментируйте, если используете

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Устанавливаем максимальный размер тела запроса для загрузки файлов (если требуется)
    client_max_body_size 25M; # Пример, установите нужное значение

    # --- Universal Links Configuration ---
    # Location для файла apple-app-site-association
    location = /.well-known/apple-app-site-association {
        # Указываем корневую директорию, где находится файл
        # Файл должен быть расположен в директории /.well-known/ относительно этого root
        root /var/www/rewindapp.ru; # <-- Укажите путь к директории, где вы разместите файл

        # Устанавливаем Content-Type на application/json, как требует инструкция
        default_type application/json;

        # Отключаем сжатие (gzip) для этого файла, как требует инструкция
        gzip off;

        # Этот файл должен быть доступен напрямую, без проксирования
        # Не нужно указывать proxy_pass здесь
    }
    # --- End Universal Links Configuration ---


    # Прокси на сервис API Gateway для всех остальных запросов
    location / {
        proxy_pass http://api-gateway-service:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Если нужно будет WebSocket
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # Логи доступа и ошибок
    access_log /var/log/nginx/rewindapp.ru.access.log;
    error_log /var/log/nginx/rewindapp.ru.error.log;
}
