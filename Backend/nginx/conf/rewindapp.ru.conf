# --- Конфигурация HTTP (порт 80) ---
# Этот блок слушает порт 80 и используется для прохождения проверки домена Certbot'ом
# и для автоматического перенаправления HTTP трафика на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rewindapp.ru www.rewindapp.ru;

    # Location для файлов проверки домена Certbot'ом (Webroot)
    # Certbot поместит сюда временные файлы для проверки
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Остальной HTTP трафик перенаправляем на HTTPS (порт 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Конфигурация HTTPS (порт 443) ---
# Этот блок слушает порт 443 и выступает как обратный прокси для вашего приложения
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rewindapp.ru www.rewindapp.ru;

    # --- НАСТРОЙКИ SSL ДЛЯ CERTBOT ---
    # Пути к файлам сертификатов, которые Certbot получит и сохранит в общем томе.
    # Если при первой сборке файлов еще нет, Nginx может выдать ошибку при старте.
    # Это нормально, т.к. сначала нужно запустить certbot один раз для их получения.
    ssl_certificate /etc/letsencrypt/live/rewindapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rewindapp.ru/privkey.pem;

    # Включение стандартных рекомендованных настроек SSL от Certbot
    # Certbot создает эти файлы при первой установке в директории /etc/letsencrypt/
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # --- КОНЕЦ НАСТРОЕК SSL ДЛЯ CERTBOT ---

    # Настройки протоколов и шифров (можно оставить стандартные от Certbot)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Секция обратного прокси для вашего приложения на порту 8080 ---
    # Все запросы, пришедшие на этот сервер (по HTTPS на домены выше), будут перенаправлены
    # на ваше приложение, работающее внутри сети Docker на порту 8080.
    location / {
        # proxy_pass указывает адрес и порт сервиса назначения.
        # 'api-gateway-service' - это ИМЯ СЕРВИСА вашего приложения в docker-compose.yml
        proxy_pass http://api-gateway-service:8080;

        # Передача стандартных заголовков для корректной работы проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Если ваше приложение использует WebSocket, раскомментируйте эти строки
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
    # --- Конец секции обратного прокси ---

    # Опционально: Логи ошибок и доступа для этого сервера (будут видны через docker logs)
    # access_log /var/log/nginx/rewindapp.ru.access.log;
    # error_log /var/log/nginx/rewindapp.ru.error.log;
}