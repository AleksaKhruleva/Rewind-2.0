definitions:
  requests.DeleteUserRequest:
    properties:
      email:
        type: string
    type: object
  requests.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  requests.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  requests.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  requests.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  requests.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  requests.SetPasswordAndUsernameRequest:
    properties:
      password:
        type: string
      registration_id:
        type: string
      username:
        type: string
    type: object
  requests.StartRegistrationRequest:
    properties:
      email:
        type: string
    type: object
  requests.VerifyEmailCodeRequest:
    properties:
      registration_id:
        type: string
      verification_code:
        type: string
    type: object
  responses.DeleteUserResponse:
    properties:
      success:
        type: boolean
    type: object
  responses.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  responses.ForgotPasswordResponse:
    properties:
      success:
        type: boolean
    type: object
  responses.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  responses.LogoutResponse:
    properties:
      success:
        type: boolean
    type: object
  responses.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  responses.ResetPasswordResponse:
    properties:
      success:
        type: boolean
    type: object
  responses.SetPasswordAndUsernameResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  responses.StartRegistrationResponse:
    properties:
      registration_id:
        description: Unique ID to track the registration process
        type: string
      success:
        type: boolean
    type: object
  responses.VerifyEmailCodeResponse:
    properties:
      success:
        type: boolean
    type: object
host: rewindapp.ru
info:
  contact: {}
  description: This is the API Gateway for the Rewind application.
  title: Rewind API Gateway
  version: "1.0"
paths:
  /api/auth/delete-user:
    post:
      consumes:
      - application/json
      description: Deletes a user account by email.
      parameters:
      - description: User email to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.DeleteUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User account successfully deleted
          schema:
            $ref: '#/definitions/responses.DeleteUserResponse'
        "400":
          description: Bad Request - Invalid email format or request body
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found - User not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Delete user account
      tags:
      - auth
  /api/auth/finish-register:
    post:
      consumes:
      - application/json
      description: Sets the user's password and username after email verification.
      parameters:
      - description: Password and username details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.SetPasswordAndUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password and username successfully set
          schema:
            $ref: '#/definitions/responses.SetPasswordAndUsernameResponse'
        "400":
          description: Bad Request - Invalid format or request body
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found - Registration ID not found or expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Conflict - User with this email or username already exists
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Set password and username (Third stage of registration)
      tags:
      - auth
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the user's email.
      parameters:
      - description: User email for password reset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset link sent (success is true even if user not
            found to prevent enumeration)
          schema:
            $ref: '#/definitions/responses.ForgotPasswordResponse'
        "400":
          description: Bad Request - Invalid email format or request body
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Request password reset
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Logs in an existing user.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully logged in
          schema:
            $ref: '#/definitions/responses.LoginResponse'
        "400":
          description: Bad Request - Invalid email or password format
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized - Invalid credentials
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User login
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user by invalidating the refresh token.
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully logged out (success is true even if token
            not found)
          schema:
            $ref: '#/definitions/responses.LogoutResponse'
        "400":
          description: Bad Request - Invalid refresh token format or request body
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User logout
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the access token using a refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token successfully refreshed
          schema:
            $ref: '#/definitions/responses.RefreshTokenResponse'
        "400":
          description: Bad Request - Invalid refresh token format
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized - Invalid or expired refresh token
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Initiates the user registration process by sending a verification
        email.
      parameters:
      - description: User email for registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.StartRegistrationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully initiated registration
          schema:
            $ref: '#/definitions/responses.StartRegistrationResponse'
        "400":
          description: Bad Request - Invalid email format or request body
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Conflict - User with this email already exists
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Start user registration (First stage of registration)
      tags:
      - auth
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the user's password using a reset token.
      parameters:
      - description: Password reset details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password successfully reset
          schema:
            $ref: '#/definitions/responses.ResetPasswordResponse'
        "400":
          description: Bad Request - Invalid password format or request body
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found - Invalid or expired reset token
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /api/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies the email verification code sent to the user.
      parameters:
      - description: Verification details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyEmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email code successfully verified
          schema:
            $ref: '#/definitions/responses.VerifyEmailCodeResponse'
        "400":
          description: Bad Request - Invalid registration ID or verification code
            format
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found - Registration ID not found or expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Conflict - Registration ID or code already used
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Verify email code (Second stage of registration)
      tags:
      - auth
swagger: "2.0"
